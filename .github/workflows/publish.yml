name: CI

on:
    pull_request:
        branches: [master]
    push:
        branches: [master]

jobs:
    build:
        name: Build and vet
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - name: Set up Go
              uses: actions/setup-go@v5
              with:
                  go-version: "1.25"

            - name: Download dependencies
              run: go mod download

            - name: Build
              run: go build ./...

            - name: Vet
              run: go vet ./...
