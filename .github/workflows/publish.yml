name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  build:
    name: Build and vet
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: clinic
          MYSQL_USER: clinic
          MYSQL_PASSWORD: clinic
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      ENV: test
      DEPLOYMENT_NAME: clinic-booking
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: 3306
      DATABASE_USERNAME: clinic
      DATABASE_PASSWORD: clinic
      DATABASE_NAME: clinic
      DATABASE_IDLE_CONNECTION: 10
      DATABASE_MAX_CONNECTION: 50
      DATABASE_CONNECTION_LIFETIME: 300
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      REDIS_DATABASE_NUMBER: 0
      REDIS_KEY_PREFIX: clinic
      CLINIC_TIMEZONE: Africa/Nairobi
      SLOT_DURATION_MINUTES: 30
      BOOKING_MINIMUM_LEAD_MINUTES: 60

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Download dependencies
        run: go mod download

      # Applies all 6 migrations (schema + doctor/patient seed data) against
      # the service container before the tests run against it.
      - name: Run migrations
        run: go run .
        env:
          SETUP_TYPE: migrate

      - name: Run tests
        run: go test ./... -v -timeout 120s
